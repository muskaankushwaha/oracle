services:
  - type: web
    name: oracle
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: none
      - key: ORACLE_TOOLS_URL
        value: http://127.0.0.1:8001

